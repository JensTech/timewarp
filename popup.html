<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TimeWarp</title>

    <style>
        :root {
            color-scheme: dark;
            --bg: #0b0b0c;
            --surface: #201b24;
            --surface-hover: #272733;
            --border: #30303d;
            --text: #f4f2ff;
            --muted: #9291a5;
            --accent: #a78bfa;
            --accent-hover: #b9a4ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            width: 300px;
            margin: 0;
            padding: 20px;
            background: var(--bg);
            color: var(--text);
            font: 13px/1.5 system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        header {
            display: flex;
            align-items: center;
            gap: 11px;
            margin-bottom: 22px;
            text-align: center;
            justify-content: center;
        }

        h1 {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.4px;
        }

        .subtitle {
            margin: 1px 0 0;
            color: var(--muted);
            font-size: 17px;
        }

        .speed-card {
            padding: 18px 14px 15px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--surface);
            text-align: center;
        }

        .speed-caption {
            color: var(--muted);
            font-size: 19px;
            font-weight: 700;
        }

        #v {
            margin: 4px 0 12px;
            color: var(--accent);
            font-size: 43px;
            font-weight: 750;
            letter-spacing: -2px;
            line-height: 1.2;
            font-variant-numeric: tabular-nums;
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            color: var(--muted);
            font-size: 10px;
        }

        input[type="range"] {
            display: block;
            width: 100%;
            height: 20px;
            margin: 5px 0 2px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 19px 0 9px;
            color: var(--muted);
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .section-heading span:last-child {
            font-weight: 400;
            letter-spacing: 0;
            text-transform: none;
        }

        .presets {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 7px;
        }

        button {
            min-height: 37px;
            padding: 7px 4px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--surface);
            color: var(--text);
            font: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition:
                background 120ms ease,
                border-color 120ms ease,
                transform 120ms ease;
        }

        button:hover {
            border-color: #6550a5;
            background: var(--surface-hover);
        }

        button:active {
            transform: scale(0.97);
        }

        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        button[data-s="0"] {
            color: #fda4af;
        }

        button[data-s="1"] {
            border-color: #6550a5;
            background: #30234e;
            color: var(--accent);
        }
    </style>
</head>

<body>
    <header>
        <div>
            <h1>TimeWarp</h1>
        </div>
    </header>

    <main>
        <section class="speed-card" aria-label="Time speed">
            <div class="speed-caption">Current speed</div>
            <div id="v" aria-live="polite">1×</div>

            <input id="s" type="range" min="0" max="3" step="0.01" value="2" aria-label="Time speed"
                aria-describedby="slider-help">

            <div class="slider-labels" id="slider-help">
                <span>Freeze</span>
                <span>Normal</span>
                <span>100×</span>
            </div>
        </section>

        <div class="section-heading">
            <span>Quick presets</span>
        </div>

        <div class="presets">
            <button type="button" data-s="0">Freeze</button>
            <button type="button" data-s="0.1">0.1×</button>
            <button type="button" data-s="0.5">0.5×</button>
            <button type="button" data-s="1">1× Normal</button>
            <button type="button" data-s="2">2×</button>
            <button type="button" data-s="15">15×</button>
            <button type="button" data-s="50">50×</button>
            <button type="button" data-s="75">75×</button>
            <button type="button" data-s="100">100×</button>
        </div>
    </main>

    <script src="popup.js"></script>
</body>

</html>
